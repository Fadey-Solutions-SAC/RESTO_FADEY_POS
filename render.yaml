# Blueprint de REFERENCIA — Web Service Node (no Docker).
# ⚠️ PRODUCCIÓN: los servicios con clientes reales (POLLERIA-KUELAP, ZOILAS, etc.)
#    se gestionan A MANO en Render. NO sincronices este archivo como Blueprint
#    sobre un servicio ya en marcha: podría crear recursos nuevos (disco, env) por error.
#
# ⚠️ DISCO PERSISTENTE: NO va en este YAML. Créalo solo a mano en Render → Disks
#    cuando sea un servicio NUEVO y vacío. Nunca añadas un segundo disco a un servicio
#    que ya tiene datos en /data.
#
# Build / Start estándar del repo:
#   Build Command: bash scripts/render-build.sh
#   Start Command: bash scripts/render-start.sh
#   DB_PATH=/data/restaurant.db  (solo si ya existe Disco con mount /data)

services:
  - type: web
    name: resto-api-node
    runtime: node
    plan: starter
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/restaurant.db
      - key: EFACT_API_URL
        value: http://127.0.0.1:8765
      - key: OUTPUT_DIR
        value: /data/efact-output
